[package]
name          = "strobemers-rs"
version       = "0.2.0"
edition       = "2024"
rust-version  = "1.85"
description   = "Rust implementation of strobemers"
readme        = "README.md"
license       = "MIT"
repository    = "https://github.com/haradama/strobemers-rs"
documentation = "https://docs.rs/strobemers-rs"
homepage      = "https://github.com/haradama/strobemers-rs"
keywords      = ["bioinformatics", "dna", "strobemers", "kmer", "hashing"]
categories    = ["science::bioinformatics::genomics", "science::bioinformatics::sequence-analysis"]
authors       = ["haradama <harada@sfc.wide.ad.jp>"]

[dependencies]
nthash-rs = "0.1.1"
thiserror = "2.0.12"

[dev-dependencies]
criterion = "0.6.0"
rand = "0.9.1"

[[bench]]
name = "benchmark"
harness = false
